name: WS Replay Integration

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  replay-test:
    name: Run WS replay integration test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake nasm

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Run ws_replay_integration test
        working-directory: backend
        run: |
          cargo test --test ws_replay_integration --features "persistence search tls" -- --nocapture
