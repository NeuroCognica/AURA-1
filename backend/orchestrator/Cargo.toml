[package]
name = "aura-orchestrator"
version = "0.1.0"
edition = "2021"
description = "Orchestrator crate: routes intents and coordinates archetypes (scaffold)"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
aura-backend = { path = ".." }
anyhow = { workspace = true }
tracing = { workspace = true }
thiserror = "1.0"
async-trait = "0.1"
tokio = { workspace = true }
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
sha2 = "0.10"
hex = "0.4"
tracing-subscriber = "0.3"

[dev-dependencies]
tempfile = "3.8"

[lib]
name = "orchestrator"
path = "src/lib.rs"

[[bin]]
name = "test-llm"
path = "src/bin/test_llm.rs"

[[bin]]
name = "test-llm-single"
path = "src/bin/test_llm_single.rs"
